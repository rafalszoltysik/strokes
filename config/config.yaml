# Konfiguracja systemu predykcji udarów

data_quality:
  # Problematyczne wartości do zastąpienia NaN
  problematic_values:
    - "#N/D"
    - "N/A"
    - "n/a"
    - "NULL"
    - "null"
    - ""
    - " "
    - "?"
    - "-"
    - "unknown"
    - "Unknown"

  # Nieprawidłowe zakresy wartości
  invalid_ranges:
    age:
      min: 0
      max: 120
    bmi:
      min: 10
      max: 100
    avg_glucose_level:
      min: 50
      max: 600

preprocessing:
  # Parametry podziału danych
  test_size: 0.2
  random_state: 42
  stratify: true

  # Strategie imputacji
  imputation_strategies:
    bmi: "group_median" # mediana według grupy wiekowej
    default: "median" # mediana ogólna

# Parametry modeli ML
models:
  random_state: 42
  n_estimators: 100
  max_iter: 1000

# Parametry monitoringu
monitoring:
  drift_threshold: 0.05
  optimal_threshold_default: 0.5

output:
  # Ścieżki wyjściowe
  processed_data_path: "data/processed/"
  save_intermediate: true

  # Format zapisu
  data_format: "numpy" # numpy, csv, parquet

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
